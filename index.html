<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Woodside 50K">
<title>Woodside Ramble 50K Training</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f9f8f6; color: #1a1a1a; padding: 12px; max-width: 820px; margin: 0 auto; }
h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 4px; }
h2 { font-size: 15px; font-weight: 700; color: #1F4E79; margin: 20px 0 8px; }
.subtitle { font-size: 12px; color: #6b6a67; margin-bottom: 8px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.pill { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 99px; }
.stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 12px; }
.stat { background: #f0ede8; border-radius: 10px; padding: 10px; text-align: center; }
.stat-val { font-size: 20px; font-weight: 700; }
.stat-lbl { font-size: 10px; color: #6b6a67; margin-top: 2px; }
.prog-wrap { margin-bottom: 14px; }
.prog-label { display: flex; justify-content: space-between; font-size: 11px; color: #6b6a67; margin-bottom: 4px; }
.prog-bar { height: 6px; background: #e5e3de; border-radius: 99px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 99px; transition: width 0.3s; background: #185FA5; }
.nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #e5e3de; }
.nav-btn { font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 99px; border: 1px solid #c5c2bc; cursor: pointer; background: #fff; color: #6b6a67; -webkit-tap-highlight-color: transparent; }
.nav-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.save-box { background: #f0ede8; border: 1px solid #d8d5cf; border-radius: 10px; padding: 12px; margin-bottom: 14px; }
.save-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.save-lbl { font-size: 12px; color: #6b6a67; flex: 1; min-width: 140px; }
.btn { font-size: 11px; font-weight: 600; padding: 5px 12px; border-radius: 99px; border: 1px solid #c5c2bc; cursor: pointer; background: #fff; -webkit-tap-highlight-color: transparent; }
.btn-primary { background: #185FA5; color: #fff; border-color: #185FA5; }
textarea { font-size: 11px; font-family: monospace; background: #fff; border: 1px solid #c5c2bc; border-radius: 8px; padding: 6px 8px; color: #1a1a1a; resize: none; width: 100%; height: 48px; }
.week { margin-bottom: 10px; border: 1px solid #e5e3de; border-radius: 12px; overflow: hidden; }
.week.deload { border-color: #DDD; }
.week.hill { border-color: #F5D4B5; }
.week.hike { border-color: #9FE1CB; }
.wk-hdr { display: flex; align-items: center; gap: 8px; padding: 10px 14px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; background: #f5f3ef; }
.week.deload .wk-hdr { background: #F5F5F5; }
.week.hill .wk-hdr { background: #FFF8F2; }
.week.hike .wk-hdr { background: #F0FBF0; }
.wk-title { font-size: 13px; font-weight: 700; flex: 1; }
.wk-meta { font-size: 11px; color: #6b6a67; }
.wk-cnt { font-size: 11px; color: #9b9893; white-space: nowrap; }
.wk-arr { font-size: 11px; color: #9b9893; transition: transform 0.2s; }
.wk-arr.open { transform: rotate(180deg); }
.day { display: grid; grid-template-columns: 36px 76px 1fr; border-top: 1px solid #e5e3de; background: #fff; }
.day.rest { opacity: 0.65; }
.day.done { background: #f5f3ef; }
.day.hill { background: #FFFAF5; }
.day.hike { background: #F0FBF0; }
.day-chk { display: flex; align-items: flex-start; justify-content: center; padding-top: 14px; border-right: 1px solid #e5e3de; }
.day-chk input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }
.day-dt { padding: 10px; border-right: 1px solid #e5e3de; }
.day-name { font-weight: 700; font-size: 12px; }
.day-date { font-size: 11px; color: #9b9893; }
.day-body { padding: 10px 12px; }
.day-title { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.day-title.done { text-decoration: line-through; color: #9b9893; }
.day-title.hill { color: #B84E00; }
.day-title.hike { color: #1A7A1A; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.day-note { font-size: 12px; color: #6b6a67; line-height: 1.55; margin-bottom: 8px; }
.notes-sec { margin-top: 10px; border-top: 1px solid #e5e3de; padding-top: 10px; }
.notes-lbl { font-size: 10px; font-weight: 700; color: #9b9893; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px; }
.notes-saved { font-size: 13px; color: #1a1a1a; line-height: 1.55; background: #f5f3ef; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; white-space: pre-wrap; display: none; }
.notes-ta { width: 100%; font-size: 13px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; border: 1px solid #c5c2bc; border-radius: 8px; padding: 8px 10px; color: #1a1a1a; background: #fff; resize: vertical; min-height: 72px; line-height: 1.55; display: none; }
.notes-ta:focus { outline: none; border-color: #185FA5; }
.btn-row { display: flex; gap: 6px; margin-top: 6px; }
.info-box { border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.info-card { border-radius: 10px; padding: 12px 14px; }
.info-card-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
.info-row { font-size: 12px; line-height: 1.7; }
.phase-prog { display: flex; flex-direction: column; gap: 10px; }
.pp-label { display: flex; justify-content: space-between; font-size: 12px; color: #6b6a67; margin-bottom: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 12px; }
th { text-align: left; font-weight: 600; font-size: 11px; color: #6b6a67; padding: 6px 10px; border-bottom: 1px solid #e5e3de; background: #f5f3ef; }
td { padding: 9px 10px; border-bottom: 1px solid #e5e3de; vertical-align: top; }
.m-card { background: #fff; border: 1px solid #e5e3de; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
.m-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.m-note { font-size: 12px; color: #6b6a67; line-height: 1.5; }
.p-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(190px,1fr)); gap: 10px; }
.p-card { background: #fff; border: 1px solid #e5e3de; border-radius: 8px; padding: 12px 14px; }
.p-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.p-body { font-size: 12px; color: #6b6a67; line-height: 1.5; }
@media (max-width:500px) { .info-grid { grid-template-columns:1fr; } .stats { grid-template-columns:repeat(2,1fr); } .wk-meta { display:none; } }
</style>
</head>

</div>

var completed = {};
var notes = {};
var openWeeks = {};
var currentView = 'overview';

function loadState() {
  try { completed = JSON.parse(localStorage.getItem('wr2_c') || '{}'); } catch(e) { completed = {}; }
  try { notes = JSON.parse(localStorage.getItem('wr2_n') || '{}'); } catch(e) { notes = {}; }
  try { openWeeks = JSON.parse(localStorage.getItem('wr2_w') || '{}'); } catch(e) { openWeeks = {}; }
  try { currentView = localStorage.getItem('wr2_v') || 'overview'; } catch(e) {}
}

function saveState() {
  localStorage.setItem('wr2_c', JSON.stringify(completed));
  localStorage.setItem('wr2_n', JSON.stringify(notes));
  localStorage.setItem('wr2_w', JSON.stringify(openWeeks));
  localStorage.setItem('wr2_v', currentView);
}

function totalDone() { return ALL_IDS.filter(function(id) { return completed[id]; }).length; }

function updateStats() {
  var done = totalDone();
  var total = ALL_IDS.length;
  var p = Math.round(done / total * 100);
  document.getElementById('stats').innerHTML =
    '<div class="stat"><div class="stat-val">' + done + '</div><div class="stat-lbl">completed</div></div>' +
    '<div class="stat"><div class="stat-val">' + total + '</div><div class="stat-lbl">total days</div></div>' +
    '<div class="stat"><div class="stat-val">' + p + '%</div><div class="stat-lbl">progress</div></div>' +
    '<div class="stat"><div class="stat-val">Dec 19</div><div class="stat-lbl">race day</div></div>';
  document.getElementById('prog-text').textContent = done + ' of ' + total;
  document.getElementById('prog-fill').style.width = p + '%';
}

function updateSaveCode() {
  var done = ALL_IDS.filter(function(id) { return completed[id]; });
  var payload = { c: done, n: notes };
  document.getElementById('save-code').value = (done.length > 0 || Object.keys(notes).some(function(k) { return notes[k]; }))
    ? btoa(unescape(encodeURIComponent(JSON.stringify(payload))))
    : '';
}

function copyCode() {
  var code = document.getElementById('save-code').value;
  if (!code) { alert('Check off some workouts first!'); return; }
  var btn = document.getElementById('copy-btn');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(code).then(function() {
      btn.textContent = 'Copied!';
      setTimeout(function() { btn.textContent = 'Copy code'; }, 2000);
    });
  } else {
    document.getElementById('save-code').select();
    document.execCommand('copy');
    btn.textContent = 'Copied!';
    setTimeout(function() { btn.textContent = 'Copy code'; }, 2000);
  }
}

function toggleImport() {
  var s = document.getElementById('import-sec');
  s.style.display = s.style.display === 'none' ? 'block' : 'none';
}

function doImport() {
  try {
    var raw = JSON.parse(decodeURIComponent(escape(atob(document.getElementById('import-code').value.trim()))));
    if (Array.isArray(raw)) {
      completed = {};
      raw.forEach(function(id) { completed[id] = true; });
    } else {
      completed = {};
      (raw.c || []).forEach(function(id) { completed[id] = true; });
      notes = raw.n || {};
    }
    saveState();
    toggleImport();
    renderView();
    updateStats();
    updateSaveCode();
  } catch(e) { alert('Invalid code - paste the full save code exactly as copied.'); }
}

function badgeHtml(keys) {
  return keys.map(function(k) {
    var s = BADGE_STYLES[k];
    if (!s) return '';
    return '<span class="badge" style="background:' + s.bg + ';color:' + s.tx + '">' + s.label + '</span>';
  }).join('');
}

function toggleDay(id) {
  completed[id] = !completed[id];
  saveState();
  updateStats();
  updateSaveCode();
  var el = document.getElementById('day-' + id);
  if (el) {
    var day = findDay(id);
    if (day) { el.outerHTML = dayHtml(day); }
  }
}

function findDay(id) {
  for (var pi = 0; pi < PHASES.length; pi++)
    for (var wi = 0; wi < PHASES[pi].weeks.length; wi++)
      for (var di = 0; di < PHASES[pi].weeks[wi].days.length; di++)
        if (PHASES[pi].weeks[wi].days[di].id === id) return PHASES[pi].weeks[wi].days[di];
  return null;
}

function startEdit(id) {
  var ta = document.getElementById('nt-' + id);
  var sv = document.getElementById('ns-' + id);
  var br = document.getElementById('nb-' + id);
  if (ta) ta.style.display = 'block';
  if (sv) sv.style.display = 'none';
  if (br) br.style.display = 'flex';
  if (ta) ta.focus();
}

function saveNote(id) {
  var ta = document.getElementById('nt-' + id);
  var sv = document.getElementById('ns-' + id);
  var br = document.getElementById('nb-' + id);
  var ab = document.getElementById('na-' + id);
  if (!ta) return;
  var val = ta.value.trim();
  notes[id] = val;
  saveState();
  updateSaveCode();
  if (ta) ta.style.display = 'none';
  if (br) br.style.display = 'none';
  if (sv) { sv.textContent = val; sv.style.display = val ? 'block' : 'none'; }
  if (ab) ab.textContent = val ? 'Edit note' : 'Add note';
}

function cancelEdit(id) {
  var ta = document.getElementById('nt-' + id);
  var sv = document.getElementById('ns-' + id);
  var br = document.getElementById('nb-' + id);
  if (ta) ta.style.display = 'none';
  if (br) br.style.display = 'none';
  if (sv && notes[id]) sv.style.display = 'block';
}

function dayHtml(day) {
  var done = !!completed[day.id];
  var isHill = day.badges.indexOf('hill') >= 0;
  var isHike = day.badges.indexOf('hike') >= 0;
  var cls = 'day' + (day.rest ? ' rest' : '') + (done ? ' done' : '') + (isHike ? ' hike' : isHill ? ' hill' : '');
  var tc = 'day-title' + (done ? ' done' : isHike ? ' hike' : isHill ? ' hill' : '');
  var acc = isHike ? '#1A7A1A' : isHill ? '#B84E00' : '#185FA5';
  var sn = notes[day.id] || '';
  var esc = function(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
  return '<div class="' + cls + '" id="day-' + day.id + '">' +
    '<div class="day-chk"><input type="checkbox"' + (done ? ' checked' : '') + ' style="accent-color:' + acc + '" data-id="' + day.id + '"></div>' +
    '<div class="day-dt"><div class="day-name">' + day.n + '</div><div class="day-date">' + day.dt + '</div></div>' +
    '<div class="day-body">' +
      '<div class="' + tc + '">' + esc(day.t) + '</div>' +
      '<div class="badges">' + badgeHtml(day.badges) + '</div>' +
      '<div class="day-note">' + esc(day.note) + '</div>' +
      '<div class="notes-sec">' +
        '<div class="notes-lbl">How did it feel?</div>' +
        '<div class="notes-saved" id="ns-' + day.id + '"' + (sn ? ' style="display:block"' : '') + '>' + esc(sn) + '</div>' +
        '<textarea class="notes-ta" id="nt-' + day.id + '" placeholder="Write 3 sentences about how it felt...">' + esc(sn) + '</textarea>' +
        '<div class="btn-row" id="nb-' + day.id + '" style="display:none">' +
          '<button class="btn btn-primary" data-save="' + day.id + '">Save note</button>' +
          '<button class="btn" data-cancel="' + day.id + '">Cancel</button>' +
        '</div>' +
        '<div class="btn-row" style="margin-top:6px">' +
          '<button class="btn" id="na-' + day.id + '" data-edit="' + day.id + '">' + (sn ? 'Edit note' : 'Add note') + '</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function weekHtml(week) {
  var isOpen = !!openWeeks[week.id];
  var done = week.days.filter(function(d) { return completed[d.id]; }).length;
  var hasHill = week.days.some(function(d) { return d.badges.indexOf('hill') >= 0; });
  var hasHike = week.days.some(function(d) { return d.badges.indexOf('hike') >= 0; });
  var wc = 'week' + (week.deload ? ' deload' : hasHike ? ' hike' : hasHill ? ' hill' : '');
  var deloadTag = week.deload ? ' <span class="pill" style="background:#F5F5F5;color:#666;font-size:10px">Deload</span>' : '';
  var h = '<div class="' + wc + '" id="wk-' + week.id + '">' +
    '<div class="wk-hdr" data-week="' + week.id + '">' +
      '<span class="wk-title">' + week.title + deloadTag + '</span>' +
      '<span class="wk-meta">' + week.meta + '</span>' +
      '<span class="wk-cnt">' + done + '/' + week.days.length + '</span>' +
      '<span class="wk-arr' + (isOpen ? ' open' : '') + '">&#9660;</span>' +
    '</div>';
  if (isOpen) {
    week.days.forEach(function(d) { h += dayHtml(d); });
  }
  h += '</div>';
  return h;
}

function toggleWeek(id) {
  openWeeks[id] = !openWeeks[id];
  saveState();
  var phase = null, week = null;
  for (var pi = 0; pi < PHASES.length; pi++) {
    for (var wi = 0; wi < PHASES[pi].weeks.length; wi++) {
      if (PHASES[pi].weeks[wi].id === id) { phase = PHASES[pi]; week = PHASES[pi].weeks[wi]; break; }
    }
  }
  var el = document.getElementById('wk-' + id);
  if (el && week) el.outerHTML = weekHtml(week);
}

document.addEventListener('click', function(e) {
  var t = e.target;
  if (t.tagName === 'INPUT' && t.type === 'checkbox' && t.dataset.id) {
    toggleDay(t.dataset.id);
  } else if (t.dataset.save) {
    saveNote(t.dataset.save);
  } else if (t.dataset.cancel) {
    cancelEdit(t.dataset.cancel);
  } else if (t.dataset.edit) {
    startEdit(t.dataset.edit);
  } else if (t.dataset.week || t.closest('[data-week]')) {
    var wel = t.closest('[data-week]') || t;
    if (wel.dataset.week) toggleWeek(wel.dataset.week);
  }
});

var VIEWS = [
  {id:'overview', label:'Overview'},
  {id:'phase1', label:'Phase 1'},
  {id:'phase2', label:'Phase 2'},
  {id:'phase3', label:'Phase 3'},
  {id:'taper', label:'Taper'},
  {id:'metrics', label:'Morning Metrics'},
  {id:'principles', label:'Principles'},
];

function renderNav() {
  document.getElementById('nav').innerHTML = VIEWS.map(function(v) {
    return '<button class="nav-btn' + (currentView === v.id ? ' active' : '') + '" data-view="' + v.id + '">' + v.label + '</button>';
  }).join('');
}

document.addEventListener('click', function(e) {
  if (e.target.dataset.view) {
    currentView = e.target.dataset.view;
    saveState();
    renderNav();
    renderView();
  }
});

function phaseWeeks(view) {
  var map = {phase1:0, phase2:1, phase3:2, taper:3};
  var pi = map[view];
  if (pi === undefined) return null;
  return PHASES[pi].weeks;
}

function renderView() {
  var c = document.getElementById('content');
  if (currentView === 'overview') { c.innerHTML = overviewHtml(); return; }
  if (currentView === 'metrics') { c.innerHTML = metricsHtml(); return; }
  if (currentView === 'principles') { c.innerHTML = principlesHtml(); return; }
  var weeks = phaseWeeks(currentView);
  if (weeks) c.innerHTML = weeks.map(weekHtml).join('');
}

function pb(p, color) {
  return '<div class="prog-bar"><div class="prog-fill" style="background:' + color + ';width:' + p + '%"></div></div>';
}

  var pp = PHASES.map(function(ph) {
    var ids = ph.weeks.reduce(function(acc, w) { return acc.concat(w.days.map(function(d) { return d.id; })); }, []);
    var done = ids.filter(function(id) { return completed[id]; }).length;
    return {label: ph.label, color: ph.color, done: done, total: ids.length};
  });

    '<div style="font-size:11px;font-weight:700;color:#854F0B;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px">The plan is something you negotiate with &mdash; not something you obey</div>' +
    '<div style="font-size:13px;color:#7A3300;line-height:1.65">Check your morning metrics every day. Resting HR 5+ beats above baseline = rest day. Quad soreness 4+ before Friday = mobility instead. The schedule serves you.</div>' +

  '<div class="info-grid">' +
    '<div class="info-card" style="background:#FFF5F5;border:1px solid #FECACA">' +

      '<div class="info-row" style="color:#7F1D1D"><strong>Friday rule:</strong> If Saturday is 2.5+ hrs &rarr; Friday is mobility only.</div>' +
      '<div class="info-row" style="color:#7F1D1D"><strong>Peak strength:</strong> Ends Week 11. Freshest legs win, not strongest squat.</div>' +
    '</div>' +
    '<div class="info-card" style="background:#E0F4FF;border:1px solid #BAE6FD">' +
      '<div class="info-card-title" style="color:#0369A1">Weekly structure</div>' +
      '<div class="info-row" style="color:#0C4A6E"><strong>Mon/Tue/Wed:</strong> Teaching days &mdash; MAF runs + paddle.</div>' +
      '<div class="info-row" style="color:#0C4A6E"><strong>Thursday:</strong> Hill repeats + plyometrics + paddle.</div>' +
      '<div class="info-row" style="color:#0C4A6E"><strong>Friday:</strong> VARIABLE &mdash; mobility if Saturday is big. Legs only if Saturday is short.</div>' +

      '<div class="info-row" style="color:#0C4A6E"><strong>Sunday:</strong> Upper body + easy MAF. Surf prep.</div>' +
    '</div>' +
  '</div>' +
  '<div class="info-grid">' +
    '<div class="info-card" style="background:#F5F5F5;border:1px solid #DDD">' +
      '<div class="info-card-title" style="color:#555">Deload weeks &mdash; Wk 4, 8, 12</div>' +

    '</div>' +

      '<div class="info-card-title" style="color:#1A7A1A">Key events</div>' +

      '<div class="info-row" style="color:#0A4A0A"><strong>Gabrielino 2:</strong> November 27 &mdash; CONDITIONAL. Full only if 1 recovery was 5-6 days.</div>' +
      '<div class="info-row" style="color:#0A4A0A"><strong>Woodside Ramble:</strong> December 19 &mdash; Sub 8:00.</div>' +
      '<div class="info-row" style="color:#0A4A0A"><strong>Then Mexico &#127940;</strong></div>' +
    '</div>' +
  '</div>' +

  '<table><thead><tr><th>Phase</th><th>Dates</th><th>Focus</th></tr></thead><tbody>' +
  [
    ['Phase 1 &mdash; Foundation','#E6F1FB','#185FA5','Aug 22 &ndash; Sep 19','Eccentric leg work begins. MAF base rebuilds. Downhill practice. Deload Week 4.'],
    ['Phase 2 &mdash; Build','#FFF0E6','#B84E00','Sep 20 &ndash; Oct 31','Heavier loading. Variable Fridays. San Gabriels runs. Pinole fueling. Deload Week 8.'],
    ['Phase 3 &mdash; Peak','#F0FBF0','#1A7A1A','Nov 1 &ndash; Nov 28','Peak strength ends Week 11. Downhill in hill sessions. Two Gabrielinos (second conditional).'],

function metricsHtml() {
  var metrics = [
    {t:'Resting HR', n:'5+ beats above your baseline = rest day regardless of plan. Check before you get out of bed.'},
    {t:'Fatigue 1-5', n:'4-5 = reduce your session. Two consecutive days of 4+ = take a full rest day.'},
    {t:'PF status 1-5', n:'Morning PF routine before first steps: calf raises, frozen bottle roll, calf stretch. Above 3 = no trail run.'},
    {t:'Quad soreness 1-5', n:'3+ before a Friday leg session = switch to mobility. 4+ before Saturday trail = shorten the run.'},
    {t:'Motivation 1-5', n:'Consistently low (2 or below for 3+ days) = body asking for recovery, not laziness.'},
  ];
  return '<h2>Morning Metrics &mdash; 30 seconds every day</h2>' +
    '<p style="font-size:13px;color:#6b6a67;margin-bottom:14px;line-height:1.6">Check these before you get out of bed. They give you permission to adapt the plan.</p>' +
    metrics.map(function(m) {
      return '<div class="m-card"><div class="m-title">' + m.t + '</div><div class="m-note">' + m.n + '</div></div>';
    }).join('') +
    '<div class="info-box" style="background:#FFF9E6;border:1px solid #F5D4A0;margin-top:12px">' +
      '<div style="font-size:13px;font-weight:700;color:#854F0B;margin-bottom:8px">Decision rules</div>' +
      ['Resting HR 5+ beats above baseline = rest day, no negotiation.',
       'Fatigue 4-5 two days in a row = take a full rest day.',
       'PF status above 3 = no trail run. Peloton or rest instead.',
       'Quad soreness 4+ before Friday = switch to mobility regardless of plan.',
       'Motivation 2 or below for 3+ consecutive days = body asking for recovery.',
       'Gabrielino 1 recovery 8-10 days = shorten or replace Gabrielino 2.',
      ].map(function(r) {
        return '<div style="font-size:12px;color:#7A3300;line-height:1.7;padding-left:12px;position:relative"><span style="position:absolute;left:2px">&middot;</span>' + r + '</div>';
      }).join('') +
    '</div>';
}

function principlesHtml() {
  var pp = [
    {t:'The plan is negotiable', x:'The plan is something you negotiate with, not something you obey. Morning metrics give you permission to adapt. Arriving healthy beats completing the schedule.'},
    {t:'Downhill is the priority', x:'Lost Sierra broke you at mile 20 on the descent. This cycle is built around fixing that. Eccentric strength, variable Fridays, fatigue-specific downhill practice.'},

      return '<div class="p-card"><div class="p-title">' + p.t + '</div><div class="p-body">' + p.x + '</div></div>';
    }).join('') +

}

loadState();
renderNav();
renderView();
updateStats();
updateSaveCode();
</script>
